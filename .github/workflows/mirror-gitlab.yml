name: Mirror GitHub to GitLab

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror master to Group 07 GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --bare \
            https://github.com/SirDanielIII/untitled-ragebait-game.git \
            repo.git

          git -C repo.git push \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.caslab.queensu.ca/f26-cisc-cmpe-3201/group-07/untitled-ragebait-game.git" \
            refs/heads/master:refs/heads/master
