name: Mirror GitHub to GitLab

on:
  push:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repository to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --bare \
            https://github.com/SirDanielIII/untitled-ragebait-game.git \
            repo.git
          git -C repo.git push --mirror \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.caslab.queensu.ca/21dz23/untitled-ragebait-game.git"
